name: Build Windows

on:
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-2022

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.38.9'
          cache: true

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Setup NuGet
        uses: nuget/setup-nuget@v2

      - name: Setup NASM
        uses: ilammy/setup-nasm@v1

      - name: Generate CA certificates
        working-directory: core/doh_proxy
        run: cargo run --bin gen_ca

      - name: Generate l10n
        run: bash scripts/gen_l10n.sh --merge

      - name: Get dependencies
        run: flutter pub get

      - name: Build Windows
        run: |
          flutter build windows --release
          mkdir dist
          $releaseDir = "build\windows\x64\runner\Release"
          Copy-Item "core\doh_proxy\certs\ca.der" "$releaseDir\proxy_ca.der"

      - name: Package Windows ZIP
        run: |
          cd build\windows\x64\runner\Release
          7z a -tzip "..\..\..\..\..\dist\fluxdo-windows-x86_64.zip" .

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: fluxdo-windows-x86_64
          path: dist/*
          if-no-files-found: error
          overwrite: true
